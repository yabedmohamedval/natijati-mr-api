spring:
  application:
    name: national-exams-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:0}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types:
      - application/json
      - text/html
      - text/plain
      - text/css
      - application/javascript
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  import-provider: ${IMPORT_PROVIDER:gcp}
  import-bucket: ${IMPORT_BUCKET:}
  import-job-name: ${IMPORT_JOB_NAME:}
  import-directory: ${IMPORT_DIRECTORY:./imports}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  import-max-rows: ${APP_IMPORT_MAX_ROWS:150000}

# Framework exception dumps can contain PostgreSQL row details. Import logs above are controlled.
logging:
  level:
    org.springframework.batch: OFF
    org.hibernate.engine.jdbc: OFF
    org.hibernate.orm.jdbc: OFF

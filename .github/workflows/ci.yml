name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Backend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker available for Testcontainers
        run: docker info > /dev/null
      - name: Unit tests
        run: mvn -B test
      - name: Integration tests and package
        run: mvn -B verify
      - name: Validate Dockerfile (no push)
        run: docker build --tag natijati-api:ci-check .
      - name: Test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
